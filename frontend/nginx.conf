server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Agent exe (va yirik fayllar) yuklash uchun — standart 1MB chegarasi yetarli emas
    client_max_body_size 64M;

    # API so'rovlarini backend konteyneriga uzatish
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /media/ {
        proxy_pass http://backend:8000;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }

    # SPA: qolgan barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
